<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ENLACE AL ARCHIVO CSS EXTERNO -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <div class="login-header">
            <h2>¡Bienvenido de nuevo!</h2>
            <p>Ingresa tus credenciales para acceder a tu cuenta.</p>
        </div>

        <form class="login-form" action="#" method="POST">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <!-- NUEVO CAMPO: SELECCIÓN DE ROL -->
            <div class="input-group">
                <label for="role">Rol / Tipo de usuario</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-gear icon"></i>
                    <select id="role" name="role" required>
                        <option value="" disabled selected>Selecciona tu rol</option>
                        <option value="admin">Administrador</option>
                        <option value="cliente">Cliente</option>
                        <option value="tecnico">Técnico</option>
                    </select>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div class="login-footer">
            <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
        </div>
    </main>

</body>
</html>
